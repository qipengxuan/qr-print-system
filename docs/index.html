<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>自助打印 - 上传文件</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, "Segoe UI", "Noto Sans CJK SC", "WenQuanYi Micro Hei", sans-serif; background: #f0f2f5; color: #1a1a2e; min-height: 100vh; }
        .container { max-width: 480px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; padding: 30px 0 20px; }
        .header h1 { font-size: 24px; color: #1a1a2e; }
        .header p { font-size: 14px; color: #6b7280; margin-top: 8px; }
        .upload-area { background: #fff; border: 2px dashed #d1d5db; border-radius: 16px; padding: 40px 20px; text-align: center; cursor: pointer; transition: all 0.2s; margin: 20px 0; }
        .upload-area:active { border-color: #635bff; background: #f5f3ff; }
        .upload-icon { width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 50%; background: #f5f3ff; display: flex; align-items: center; justify-content: center; }
        .upload-icon svg { width: 28px; height: 28px; color: #635bff; }
        .upload-text { font-size: 16px; color: #1a1a2e; font-weight: 500; }
        .upload-hint { font-size: 13px; color: #9ca3af; margin-top: 8px; }
        .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: #635bff; color: #fff; }
        .btn-primary:active { background: #5a4ed6; }
        .btn-primary:disabled { background: #c4b8fd; cursor: not-allowed; }
        .btn-secondary { background: #f3f4f6; color: #374151; margin-top: 12px; }
        .result { display: none; background: #fff; border-radius: 16px; padding: 30px 20px; text-align: center; }
        .result.show { display: block; }
        .result h2 { font-size: 18px; margin-bottom: 20px; color: #059669; }
        .qr-wrapper { display: inline-block; padding: 16px; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .qr-wrapper img { display: block; width: 200px; height: 200px; }
        .token-display { font-size: 32px; font-weight: 700; letter-spacing: 8px; color: #635bff; margin: 20px 0; font-family: monospace; }
        .countdown { font-size: 14px; color: #6b7280; margin-bottom: 16px; }
        .tips-result { font-size: 13px; color: #6b7280; text-align: left; background: #f9fafb; border-radius: 12px; padding: 16px; margin-top: 16px; line-height: 1.8; }
        .file-info { display: none; background: #ecfdf5; border-radius: 10px; padding: 12px 16px; margin: 12px 0; font-size: 14px; color: #059669; }
        .file-info.show { display: block; }
        .status-bar { display: none; border-radius: 10px; padding: 12px 16px; margin: 12px 0; font-size: 14px; text-align: center; }
        .status-bar.uploading { display: block; background: #fef3c7; color: #92400e; }
        .status-bar.error { display: block; background: #fee2e2; color: #991b1b; }
        .tips { font-size: 13px; color: #6b7280; margin-top: 20px; line-height: 1.8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>自助打印</h1>
            <p>上传文件 - 获取二维码 - 打印机旁扫码取件</p>
        </div>

        <div id="uploadSection">
            <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg,.gif,.bmp,.tiff,.webp,.doc,.docx,.ppt,.pptx,.xls,.xlsx" style="display:none;">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
                    </svg>
                </div>
                <div class="upload-text">点击选择文件</div>
                <div class="upload-hint">支持 PDF、图片、Office 文档</div>
            </div>

            <div class="file-info" id="fileInfo">
                <span id="fileName"></span>
            </div>

            <button class="btn btn-primary" id="uploadBtn" disabled>上传并生成二维码</button>

            <div class="tips">
                <strong>支持的格式：</strong><br>
                PDF、图片（PNG/JPG/GIF/BMP/TIFF/WEBP）<br>
                Office 文档（Word / PPT / Excel）<br>
                <strong>文件大小限制：50MB</strong>
            </div>
        </div>

        <div class="status-bar" id="statusBar"></div>

        <div class="result" id="resultSection">
            <h2>上传成功！请到打印机旁扫码取件</h2>
            <div class="qr-wrapper">
                <img id="qrImage" alt="取件二维码">
            </div>
            <div class="token-display" id="tokenDisplay"></div>
            <div class="countdown" id="countdown"></div>
            <div class="tips-result">
                <strong>取件步骤：</strong><br>
                1. 前往打印机旁的扫码终端<br>
                2. 将二维码对准扫码枪，或手动输入取件码<br>
                3. 等待打印完成<br><br>
                <strong>取件码 30 分钟内有效，打印后自动销毁文件</strong>
            </div>
            <button class="btn btn-secondary" onclick="location.reload()">上传新文件</button>
        </div>
    </div>

    <script>
        var selectedFile = null;
        var uploadArea = document.getElementById('uploadArea');
        var fileInput = document.getElementById('fileInput');
        var uploadBtn = document.getElementById('uploadBtn');

        uploadArea.addEventListener('click', function() {
            fileInput.click();
        });

        fileInput.addEventListener('change', function(e) {
            if (e.target.files && e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                var sizeStr = formatSize(selectedFile.size);
                document.getElementById('fileName').textContent = selectedFile.name + ' (' + sizeStr + ')';
                document.getElementById('fileInfo').classList.add('show');
                uploadBtn.disabled = false;
            }
        });

        uploadBtn.addEventListener('click', function() {
            if (!selectedFile) {
                alert('请先选择文件');
                return;
            }

            uploadBtn.disabled = true;
            uploadBtn.textContent = '上传中...';
            showStatus('正在上传文件...', 'uploading');

            var formData = new FormData();
            formData.append('file', selectedFile);

            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/upload', true);

            xhr.onload = function() {
                if (xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        showResult(data);
                    } catch(e) {
                        showStatus('解析响应失败: ' + e.message, 'error');
                        uploadBtn.disabled = false;
                        uploadBtn.textContent = '上传并生成二维码';
                    }
                } else {
                    try {
                        var errData = JSON.parse(xhr.responseText);
                        showStatus(errData.detail || '上传失败 (' + xhr.status + ')', 'error');
                    } catch(e) {
                        showStatus('上传失败 (' + xhr.status + ')', 'error');
                    }
                    uploadBtn.disabled = false;
                    uploadBtn.textContent = '上传并生成二维码';
                }
            };

            xhr.onerror = function() {
                showStatus('网络错误，无法连接服务器', 'error');
                uploadBtn.disabled = false;
                uploadBtn.textContent = '上传并生成二维码';
            };

            xhr.send(formData);
        });

        function showResult(data) {
            document.getElementById('statusBar').style.display = 'none';
            document.getElementById('uploadSection').style.display = 'none';
            document.getElementById('resultSection').classList.add('show');
            document.getElementById('qrImage').src = data.qr_code;
            document.getElementById('tokenDisplay').textContent = data.token;

            var remaining = data.expires_in;
            var updateCountdown = function() {
                if (remaining <= 0) {
                    document.getElementById('countdown').textContent = '已过期，请重新上传';
                    return;
                }
                var min = Math.floor(remaining / 60);
                var sec = remaining % 60;
                document.getElementById('countdown').textContent = '剩余有效时间: ' + min + '分' + sec + '秒';
                remaining--;
            };
            updateCountdown();
            setInterval(updateCountdown, 1000);
        }

        function showStatus(msg, type) {
            var bar = document.getElementById('statusBar');
            bar.textContent = msg;
            bar.className = 'status-bar ' + type;
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }
    </script>
</body>
</html>
