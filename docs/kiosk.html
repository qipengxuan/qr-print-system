<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扫码打印终端</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, "Segoe UI", "Noto Sans CJK SC", "WenQuanYi Micro Hei", sans-serif; background: #0f0f1a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .terminal { width: 100%; max-width: 500px; padding: 40px 30px; text-align: center; }
        .title { font-size: 28px; margin-bottom: 8px; font-weight: 700; }
        .subtitle { font-size: 14px; color: #9ca3af; margin-bottom: 40px; }
        .input-wrapper { position: relative; margin-bottom: 24px; }
        .token-input { width: 100%; font-size: 36px; text-align: center; letter-spacing: 12px; padding: 20px; border: 2px solid #374151; border-radius: 16px; background: #1f1f2e; color: #fff; outline: none; text-transform: uppercase; }
        .token-input:focus { border-color: #635bff; }
        .btn-print { width: 100%; padding: 18px; font-size: 20px; font-weight: 600; border: none; border-radius: 16px; background: #635bff; color: #fff; cursor: pointer; }
        .btn-print:active { background: #5a4ed6; }
        .btn-print:disabled { background: #4b4453; cursor: not-allowed; }
        .result { display: none; }
        .result.show { display: block; }
        .result-icon { font-size: 64px; margin-bottom: 16px; }
        .result-icon.success { color: #10b981; }
        .result-icon.error { color: #ef4444; }
        .result-icon.waiting { color: #f59e0b; }
        .result-icon.info { color: #3b82f6; }
        .result-title { font-size: 24px; font-weight: 600; margin-bottom: 12px; }
        .result-message { font-size: 16px; color: #9ca3af; margin-bottom: 8px; }
        .result-filename { font-size: 14px; color: #6b7280; margin-bottom: 24px; }
        .btn-continue { width: 100%; padding: 14px; font-size: 16px; border: 2px solid #374151; border-radius: 12px; background: transparent; color: #fff; cursor: pointer; margin-top: 16px; }
        .scan-hint { font-size: 13px; color: #6b7280; margin-top: 40px; line-height: 1.8; text-align: left; background: #1f1f2e; padding: 16px; border-radius: 12px; }
        .auto-return { font-size: 14px; color: #6b7280; margin-top: 20px; }
        .status { display: none; padding: 12px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; }
        .status.error { display: block; background: #ef4444; color: #fff; }
    </style>
</head>
<body>
    <div class="terminal">
        <!-- Input Section -->
        <div id="inputSection">
            <div class="title">扫码打印终端</div>
            <div class="subtitle">请扫描二维码或输入取件码</div>
            <div class="input-wrapper">
                <input type="text" class="token-input" id="tokenInput" placeholder="取件码" maxlength="6" autocomplete="off" autofocus>
            </div>
            <button class="btn-print" id="printBtn" onclick="submitPrint()">打印</button>
            <div class="scan-hint">
                <strong>使用说明：</strong><br>
                将手机上的二维码对准扫码枪，系统自动识别并打印<br>
                也可手动输入 6 位取件码后点击「打印」按钮
            </div>
        </div>

        <!-- Status -->
        <div class="status" id="statusBar"></div>

        <!-- Result Section -->
        <div class="result" id="resultSection">
            <div class="result-icon" id="resultIcon"></div>
            <div class="result-title" id="resultTitle"></div>
            <div class="result-message" id="resultMessage"></div>
            <div class="result-filename" id="resultFilename"></div>
            <button class="btn-continue" onclick="resetTerminal()">继续打印</button>
        </div>

        <div class="auto-return" id="autoReturn"></div>
    </div>

    <script>
        var tokenInput = document.getElementById('tokenInput');
        var printBtn = document.getElementById('printBtn');

        // Enter 键自动提交（USB 扫码枪会发送 Enter）
        tokenInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                submitPrint();
            }
        });

        // 输入满 6 位自动提交
        tokenInput.addEventListener('input', function(e) {
            if (e.target.value.length === 6) {
                setTimeout(function() { submitPrint(); }, 200);
            }
        });

        function submitPrint() {
            var token = tokenInput.value.trim().toUpperCase();
            if (!token) {
                showStatus('请输入取件码');
                return;
            }

            printBtn.disabled = true;
            printBtn.textContent = '打印中...';
            document.getElementById('statusBar').style.display = 'none';

            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/print/' + token, true);

            xhr.onload = function() {
                printBtn.disabled = false;
                printBtn.textContent = '打印';

                var data = null;
                try {
                    data = JSON.parse(xhr.responseText);
                } catch(e) {
                    showResult('error', '错误', '服务器响应异常', '');
                    return;
                }

                if (xhr.status === 200 && data.status === 'success') {
                    showResult('success', '打印成功', data.message || '', data.filename || '');
                } else if (data.status === 'printing') {
                    showResult('waiting', '正在打印', data.message || '', '');
                } else if (data.status === 'printed') {
                    showResult('info', '已打印', data.message || '', '');
                } else {
                    showResult('error', '打印失败', data.message || data.detail || '未知错误', '');
                }
            };

            xhr.onerror = function() {
                printBtn.disabled = false;
                printBtn.textContent = '打印';
                showResult('error', '网络错误', '无法连接服务器，请检查后端程序是否运行', '');
            };

            xhr.send();
        }

        function showStatus(msg) {
            var bar = document.getElementById('statusBar');
            bar.textContent = msg;
            bar.className = 'status error';
        }

        function showResult(type, title, message, filename) {
            document.getElementById('inputSection').style.display = 'none';
            document.getElementById('resultSection').classList.add('show');
            document.getElementById('resultIcon').className = 'result-icon ' + type;
            document.getElementById('resultIcon').textContent =
                type === 'success' ? '\u2713' :
                type === 'error' ? '\u2717' :
                type === 'waiting' ? '\u23F3' : 'i';
            document.getElementById('resultTitle').textContent = title;
            document.getElementById('resultMessage').textContent = message;
            document.getElementById('resultFilename').textContent = filename ? '\u2630 ' + filename : '';
            document.getElementById('resultFilename').style.display = filename ? 'block' : 'none';

            // 8 秒后自动返回
            var count = 8;
            var countdownEl = document.getElementById('autoReturn');
            var timer = setInterval(function() {
                count--;
                if (count <= 0) {
                    clearInterval(timer);
                    resetTerminal();
                } else {
                    countdownEl.textContent = count + ' 秒后自动返回...';
                }
            }, 1000);
            countdownEl.textContent = count + ' 秒后自动返回...';
        }

        function resetTerminal() {
            document.getElementById('inputSection').style.display = 'block';
            document.getElementById('resultSection').classList.remove('show');
            document.getElementById('autoReturn').textContent = '';
            document.getElementById('statusBar').style.display = 'none';
            tokenInput.value = '';
            tokenInput.focus();
        }
    </script>
</body>
</html>
